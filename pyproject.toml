[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emergence-core"
version = "0.1.0"
description = "Protected provider gateway and experiment accounting service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21",
  "alembic>=1.16",
  "anyio>=4.11",
  "fastapi>=0.115",
  "httpx>=0.28",
  "prometheus-client>=0.22",
  "pydantic>=2.11",
  "pydantic-settings>=2.9",
  "pyyaml>=6",
  "sqlalchemy[asyncio]>=2.0",
  "typer>=0.16",
  "uvicorn>=0.34",
]

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1", "ruff>=0.11", "types-pyyaml>=6"]

[project.scripts]
emergence = "emergence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/emergence"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: explicitly enabled, bounded provider integration tests"]
